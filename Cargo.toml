[package]
name = "diorama-raytracer"
version = "0.1.0"
edition = "2024"

[dependencies]
raylib = { version = "6.0.0", features = [
    "SUPPORT_IMAGE_GENERATION",
    "SUPPORT_IMAGE_EXPORT",
    "SUPPORT_FILEFORMAT_PNG",
] }

# El raytracer es tiempo real: sin optimizaciones ni en debug se arrastra.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
